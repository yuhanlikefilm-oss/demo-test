<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Husky Pet Demo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="pet" class="idle">
      <div class="shadow"></div>
      <div class="bubble" id="bubble">汪～我在陪你工作。</div>
      <div class="husky">
        <div class="ear left"></div>
        <div class="ear right"></div>
        <div class="head">
          <div class="mask"></div>
          <div class="face"></div>
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="nose"></div>
          <div class="mouth"></div>
        </div>
        <div class="body"></div>
        <div class="tail"></div>
      </div>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
